# CI：Rust、TS、生成产物检查、E2E（Playwright + SDK 对真实 hub/daemon）、Docker 构建（自包含 Dockerfile）；main 上全部通过后推 edge 镜像。
# 本地等价命令：`just lint`、`just test`、`just gen-check`、`just e2e`、`just test-sdk-real`、`just docker-hub`。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      # 进程内 hub + 真实 daemon 子进程（mock agent）+ CLI 客户端的 happy path；workspace 测试里已包含，单列一步方便看结果。
      - name: happy path（hub + daemon + CLI 端到端）
        run: cargo test -p anycon-cli --test happy_path
      - name: crypto wasm 目标能编译
        run: cargo check -p anycon-crypto --features wasm --target wasm32-unknown-unknown

  ts:
    name: ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # wasm 产物（packages/protocol/wasm）让 protocol / sdk 的测试跑真实 Noise 而不只是 mock，也是 web 构建的输入。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-pack
      - name: bun 安装缓存
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: bun.lock 里没有非默认 registry 的地址
        run: |
          if grep -E '"https://registry\.' bun.lock | grep -v 'registry\.npmjs\.org'; then
            echo "bun.lock 含非默认 registry 地址：本地跑 \`just lock-clean\` 后再提交" >&2
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - name: 构建 wasm
        run: just gen-wasm
      - name: lint
        run: bun run lint
      - name: 格式检查（oxfmt）
        run: bun run fmt:check
      - name: typecheck
        run: bun run typecheck
      - name: test（bun）
        run: bun run test
      - name: test（Node 运行时）
        run: |
          bun run --cwd packages/protocol test:node
          bun run --cwd packages/sdk test:node
      - name: build 包
        run: |
          bun run --cwd packages/protocol build
          bun run --cwd packages/sdk build
      - name: build web
        if: hashFiles('web/package.json') != ''
        run: bun run --cwd web build

  gen-check:
    name: gen-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: bun 安装缓存
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: 重新生成 schema 和 TS 类型
        run: just gen
      - name: 重新生成 msgpack / JSON-RPC 测试向量
        run: just gen-vectors
      - name: 产物无 diff
        run: git diff --exit-code -- schema packages/protocol/src/generated.ts packages/protocol/src/method-types.ts packages/protocol/tests/vectors

  e2e:
    name: e2e
    needs: [rust, ts]
    runs-on: ubuntu-latest
    env:
      # daemon 默认启动时要跑 `$SHELL -ilc` 解析登录环境；CI 里没有用户 rc，关掉省几秒（测试夹具也各自设了一遍）。
      ANYCON_AGENTS__ENV_FROM_LOGIN_SHELL: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-pack
      - name: bun 安装缓存
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # 顺序很重要：wasm → web → cargo。hub 的 build.rs 在编译时选中 web/dist 嵌入，web 又依赖 wasm。
      - name: 1. 构建 wasm
        run: just gen-wasm
      - name: 2. build web
        if: hashFiles('web/package.json') != ''
        run: bun run --cwd web build
      - name: 3. build hub + cli
        run: cargo build -p anycon-hub -p anycon-cli
      # SDK 对真实 hub + daemon（mock agent）：pair → connect → send → 权限 → history → cancel。
      - name: SDK 对真实 hub + daemon
        run: just test-sdk-real
      - name: Playwright 浏览器缓存
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: 安装 chromium（缓存未命中）
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: bunx playwright install --with-deps chromium
      - name: 安装 chromium 的系统依赖（缓存命中）
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: bunx playwright install-deps chromium
      - name: playwright
        env:
          E2E_REQUIRE_DAEMON: "1"
          # 失败时要看 hub / daemon 的日志：保留临时目录，路径写到已知文件里（下一步按它收集）
          E2E_KEEP_TMP: "1"
          E2E_TMP_DIR_FILE: ${{ runner.temp }}/e2e-tmp-dir
          # hub 和 daemon 都读它（global-setup 把环境传给两者）。debug 级也只有元数据：设备 id、seq、长度、方法名、耗时，
          # 没有会话内容（hub 不解析 payload；daemon 的 debug 日志不打印消息、工具输出或 RPC 参数）
          ANYCON_LOG: info,anycon_hub=debug,anycon_daemon=debug
        run: bun run --cwd e2e test
      - name: 收集 hub / daemon 日志
        if: failure()
        run: |
          mkdir -p e2e/ci-logs
          dir=$(cat "${{ runner.temp }}/e2e-tmp-dir" 2>/dev/null || true)
          if [ -n "$dir" ] && [ -d "$dir" ]; then
            # 只拿这两个日志：临时目录里还有 daemon 的密钥、hub 的数据库和管理员 token，不进产物
            for f in hub.log daemon.log; do
              if [ -f "$dir/$f" ]; then cp "$dir/$f" e2e/ci-logs/; fi
            done
          else
            echo "e2e tmp dir not found (global-setup did not get that far?)"
          fi
          ls -la e2e/ci-logs
      - name: 上传报告
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/ci-logs
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: docker (hub image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # docker/hub.Dockerfile 是自包含的：wasm（wasm-bindgen-cli）→ Web UI（bun + vite）→ hub（嵌入 Web UI）→ distroless。
      # 用默认基础镜像；Docker Hub 连不上的机器本地换源见 `just docker-hub` 的注释。
      - name: 构建（不推送）
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/hub.Dockerfile
          push: false
          load: true
          tags: anycon-hub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 容器起得来，/healthz 200，提供的是真正的 Web UI
        run: |
          docker run -d --name hub -p 127.0.0.1:8080:8080 -v anycon-ci-data:/data \
            -e ANYCON_PUBLIC_URL=http://127.0.0.1:8080 \
            -e 'ANYCON_PREVIEW_URL=http://*.preview.localhost:8080' anycon-hub:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          echo
          # 不是 crates/hub/static-placeholder 的占位页，而是嵌进去的 web/dist（有 #root 和带哈希的入口脚本）。
          curl -fsS http://127.0.0.1:8080/ > index.html
          grep -q 'id="root"' index.html
          if grep -q 'does not include the web UI' index.html; then echo "hub embeds the placeholder page, not the web UI" >&2; exit 1; fi
          asset=$(grep -o '/assets/[^"]*\.js' index.html | head -1)
          curl -fsS -o /dev/null "http://127.0.0.1:8080${asset}"
          # 真实 Noise wasm 在产物里：web 构建缺 wasm 时 vite 会换成桩，所以显式确认它被嵌进来并以 application/wasm 提供。
          # service worker 的预缓存清单（/sw.js）列出了全部产物，包括带哈希的 wasm。
          wasm=$(curl -fsS http://127.0.0.1:8080/sw.js | grep -o 'assets/anycon_crypto_bg-[A-Za-z0-9_-]*\.wasm' | head -1)
          test -n "$wasm"
          curl -fsS -D headers.txt -o wasm.bin "http://127.0.0.1:8080/${wasm}"
          grep -qi '^content-type: application/wasm' headers.txt
          test "$(wc -c < wasm.bin)" -gt 100000
          # 预览运行时（ADR-39）是第二份嵌入：预览域名上的引导页不是 static-placeholder-preview，
          # sw.js 带 Service-Worker-Allowed，主域名上取不到它们。
          preview_host='aaaaaaaaaaaaaaaaaaaaaaaaaa.preview.localhost:8080'
          curl -fsS -H "Host: $preview_host" http://127.0.0.1:8080/__anycon/enter > enter.html
          if grep -q 'The preview runtime is not built into this hub' enter.html; then echo "hub embeds the preview placeholder" >&2; exit 1; fi
          grep -q '/__anycon/' enter.html
          curl -fsS -D sw-headers.txt -o /dev/null -H "Host: $preview_host" http://127.0.0.1:8080/__anycon/sw.js
          grep -qi '^service-worker-allowed: /' sw-headers.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/__anycon/sw.js)" = 404
          # 镜像自带的 HEALTHCHECK（distroless 里没有 curl）也要变成 healthy
          for _ in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' hub)" = healthy ]; then exit 0; fi
            sleep 1
          done
          docker logs hub
          exit 1

  # main 上全部检查通过后推 ghcr.io/anycon-ai/hub:edge 和 :sha-<短 sha>，给要跟着 main 跑的自建 hub 用（docs/deploy.md 开头）。
  # 只有 amd64：arm64 要原生 runner 从头编 Rust，跟 main 的场景不值得；正式版的多架构镜像由 release.yml 出。
  # docker job 刚用同一个 Dockerfile 写了 gha 缓存，这里基本全部命中，不重新编译。
  edge:
    name: docker (edge image)
    needs: [rust, ts, gen-check, e2e, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: 标签
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/anycon-ai/hub
          flavor: |
            latest=false
          tags: |
            type=edge,branch=main
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=anycon-hub
            org.opencontainers.image.description=Anycon hub (edge, built from main; not a release)
      - uses: docker/setup-buildx-action@v4
      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/hub.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
