[package]
name = "anycon-adapters"
description = "agent adapter：claude-code（stream-json）、codex（app-server JSON-RPC）、mock（测试与 E2E）"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anycon-agent-api.workspace = true
async-trait.workspace = true
anycon-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
which = "8.0.6"
shell-words = "1.1.1"
semver = "1.0.28"
uuid.workspace = true
tokio-util = "0.7.20"
base64.workspace = true
sha2 = "0.11.0"

[dev-dependencies]
jsonschema = { version = "0.59.0", default-features = false }
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
