[package]
name = "anycon-daemon"
description = "daemon 核心：hub 连接、Noise 对端、本机 socket、会话、workspace、存储、agent 探测"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anycon-agent-api.workspace = true
anycon-adapters.workspace = true
anycon-crypto.workspace = true
anycon-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
futures.workspace = true
async-trait.workspace = true
rand.workspace = true
uuid.workspace = true
hex.workspace = true
base64.workspace = true
tracing-subscriber.workspace = true
figment = { version = "0.10.19", features = ["toml", "env"] }
notify = "8.2.0"
toml_edit = "0.25.17"
shell-words = "1.1.1"
tracing-appender = "0.2.5"
sha2 = "0.11.0"
libc = "0.2.190"
tokio-rustls = "0.26.6"
webpki-roots = "0.26"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rmp-serde.workspace = true
serde_bytes = "0.11.19"
tempfile = { version = "3.27.0", optional = true }
zeroize = "1.9.1"
unicode-normalization = "0.1.25"

[dev-dependencies]
anycon-hub = { path = "../hub" }
jsonschema = { version = "0.58.6", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tempfile = "3.27.0"

# 集成测试和 cli 的测试用 `testutil::FakeAdapter`（不依赖 adapters crate 的 mock）。
[features]
testing = ["dep:tempfile"]

[dev-dependencies.anycon-daemon]
path = "."
features = ["testing"]
