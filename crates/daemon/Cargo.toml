[package]
name = "anycon-daemon"
description = "daemon 核心：hub 连接、Noise 对端、本机 socket、会话、workspace、存储、agent 探测"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anycon-agent-api.workspace = true
anycon-adapters.workspace = true
anycon-crypto.workspace = true
anycon-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
futures.workspace = true
async-trait.workspace = true
rand.workspace = true
uuid.workspace = true
hex.workspace = true
base64.workspace = true
tracing-subscriber.workspace = true
figment = { version = "0.10.19", features = ["toml", "env"] }
notify = "8.2.0"
toml_edit = "0.25.17"
shell-words = "1.1.1"
tracing-appender = "0.2.5"
sha2 = "0.11.0"
tokio-rustls = "0.26.6"
webpki-roots = "0.26"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rmp-serde.workspace = true
serde_bytes = "0.11.19"
tempfile = { version = "3.27.0", optional = true }
zeroize = "1.9.1"
unicode-normalization = "0.1.25"
flate2 = "1.1.10"
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "0.1.5"
http = "1.5.0"
bytes = "1.12.1"
http-body = "1.1.0"
dunce = "1.0.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[dev-dependencies]
anycon-hub = { path = "../hub" }
jsonschema = { version = "0.60.2", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tempfile = "3.27.0"

# 集成测试和 cli 的测试用 `testutil::FakeAdapter`（不依赖 adapters crate 的 mock）。
[features]
testing = ["dep:tempfile"]

[dev-dependencies.anycon-daemon]
path = "."
features = ["testing"]
