# 一次性工具：用 Rust 侧的真实编码器生成 TS 编解码测试的字节级 fixture。
# 不是 workspace 成员（空 [workspace] 让 cargo 把它当独立工程）；跑法见 packages/protocol/README.md。
[package]
name = "gen-vectors"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
anycon-protocol = { path = "../../../../crates/protocol" }
serde_json = "1"
hex = "0.4"
rmp-serde = "1"

[workspace]
